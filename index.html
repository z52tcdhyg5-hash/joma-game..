<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>한글 월드: 자모를 구하라!</title>
<style>
:root{--ink:#263238;--paper:#fffdf5;--blue:#b9e5ff;--pink:#ffd6e7;--yellow:#ffe99a;--green:#c9f2c7;--line:#263238}
*{box-sizing:border-box}body{margin:0;background:#f4f1e8;color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px}.top{border:3px solid var(--line);background:var(--paper);padding:16px;border-radius:14px;box-shadow:5px 5px 0 var(--line)}
h1{font-size:clamp(23px,5vw,34px);margin:0 0 5px}.sub{margin:0;font-size:14px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.pill{border:2px solid var(--line);border-radius:999px;padding:6px 11px;background:white;font-weight:700}
.progress{height:12px;border:2px solid var(--line);background:white;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:#83d7a1;transition:width .2s}
.panel{margin-top:14px;border:3px solid var(--line);border-radius:14px;background:white;padding:16px;box-shadow:4px 4px 0 var(--line)}
.stagehead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.badge{background:var(--yellow);border:2px solid var(--line);padding:4px 9px;border-radius:8px;font-weight:800}
h2{margin:7px 0 8px;font-size:22px}.prompt{font-size:18px;font-weight:750;line-height:1.5}.hint{font-size:14px;opacity:.8}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
button{font:inherit;cursor:pointer;border:2px solid var(--line);border-radius:10px;background:var(--paper);padding:12px;font-weight:750;box-shadow:0 3px 0 var(--line);color:var(--ink);min-height:48px}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}button:disabled{opacity:.55;cursor:default}
.choices button{font-size:23px;background:var(--blue)}.choices button:nth-child(2n){background:var(--pink)}.choices button:nth-child(3n){background:var(--green)}
.feedback{min-height:30px;margin-top:13px;font-weight:750}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row button{flex:1}.primary{background:var(--yellow)}.secondary{background:white}
.tiles{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tile{font-size:24px;min-width:48px;background:var(--pink);padding:8px 12px;border:2px solid var(--line);border-radius:9px;text-align:center}
.wordbox{font-size:24px;min-height:54px;border:2px dashed #68777e;border-radius:10px;padding:8px;margin-top:10px;background:#fafafa}
.small{font-size:12px;opacity:.75}.hide{display:none}.result{font-size:20px;font-weight:800}.footer{text-align:center;font-size:12px;margin:20px 0;opacity:.7}
@media(max-width:420px){.wrap{padding:10px}.panel{padding:12px}.choices{gap:8px}.choices button{font-size:20px}}
</style></head>
<body><main class="wrap">
<header class="top"><h1>🎮 한글 월드: 자모를 구하라!</h1><p class="sub">자음과 모음을 모아 한글 세계를 구하자! 🌱 미션 순서는 플레이할 때마다 랜덤!</p>
<div class="stats"><span class="pill">스테이지 <b id="stageNum">1</b>/3</span><span class="pill">점수 <b id="score">0</b></span><span class="pill">이번 미션 <b id="round">1</b></span><span class="pill">남은 시간 <b id="time">30</b>초</span></div>
<div class="progress"><div class="bar" id="bar"></div></div></header>
<section class="panel" id="game"><div class="stagehead"><span class="badge" id="stageTag">STAGE 1 · FIND</span><span class="hint" id="stagePoints">스테이지 점수 0 / 100</span></div>
<h2 id="title">자모 정글 — FIND</h2><p class="prompt" id="prompt"></p><p class="hint" id="instruction"></p>
<div id="choices" class="choices"></div><div id="buildArea" class="hide"><div class="tiles" id="tiles"></div><div class="hint">아래 자모를 순서대로 눌러 음절을 만드세요.</div><div class="wordbox" id="wordbox">아직 선택한 자모가 없어요</div><div class="row"><button id="undo" class="secondary">↩ 하나 취소</button><button id="submitBuild" class="primary">정답 확인</button></div></div>
<div id="feedback" class="feedback" aria-live="polite"></div><div class="row"><button id="next" class="primary hide">다음 미션 →</button><button id="restart" class="secondary">처음부터</button></div></section>
<section class="panel hide" id="ending"><div class="result">🏆 한글 월드 탐험 완료!</div><p id="endText"></p><button id="playAgain" class="primary">다시 플레이</button></section>
<p class="footer">자모를 찾고 · 조합하고 · 단어를 완성해 보세요!</p></main>
<script>
const $=id=>document.getElementById(id);
const stages=[
 {tag:"STAGE 1 · FIND",title:"자모 정글 — FIND",desc:"미션에 맞는 자모를 찾아 터치하세요. 정답 +10점!",type:"find",qs:[
  ["모음 ㅏ를 찾으세요.",["ㄱ","ㅏ","ㅁ","ㅗ"],"ㅏ"],["자음 ㄴ을 찾으세요.",["ㅓ","ㄴ","ㅜ","ㄷ"],"ㄴ"],["모음 ㅗ를 찾으세요.",["ㅗ","ㅅ","ㅣ","ㄹ"],"ㅗ"],["자음 ㅁ을 찾으세요.",["ㅏ","ㅎ","ㅁ","ㅓ"],"ㅁ"],["모음 ㅜ를 찾으세요.",["ㄱ","ㅜ","ㅂ","ㅑ"],"ㅜ"],["자음 ㄱ을 찾으세요.",["ㅕ","ㄹ","ㄱ","ㅔ"],"ㄱ"],["모음 ㅣ를 찾으세요.",["ㅁ","ㅣ","ㅗ","ㄷ"],"ㅣ"],["자음 ㅂ을 찾으세요.",["ㅏ","ㅂ","ㅅ","ㅡ"],"ㅂ"],["모음 ㅓ를 찾으세요.",["ㄴ","ㅓ","ㄱ","ㅜ"],"ㅓ"],["자음 ㅎ을 찾으세요.",["ㅎ","ㅏ","ㄷ","ㅗ"],"ㅎ"]]},
 {tag:"STAGE 2 · BUILD",title:"자모 공장 — BUILD",desc:"목표 음절을 보고 자음과 모음을 순서대로 조합하세요. 정답 +10점!",type:"build",qs:[
  ["가",["ㄱ","ㅏ","ㄴ","ㅗ"],["ㄱ","ㅏ"]],["너",["ㄴ","ㅓ","ㄱ","ㅣ"],["ㄴ","ㅓ"]],["모",["ㅁ","ㅗ","ㄷ","ㅏ"],["ㅁ","ㅗ"]],["수",["ㅅ","ㅜ","ㄴ","ㅓ"],["ㅅ","ㅜ"]],["비",["ㅂ","ㅣ","ㄱ","ㅏ"],["ㅂ","ㅣ"]],["하",["ㅎ","ㅏ","ㄹ","ㅗ"],["ㅎ","ㅏ"]],["문",["ㅁ","ㅜ","ㄴ","ㅏ"],["ㅁ","ㅜ","ㄴ"]],["간",["ㄱ","ㅏ","ㄴ","ㅗ"],["ㄱ","ㅏ","ㄴ"]],["밥",["ㅂ","ㅏ","ㅂ","ㅜ"],["ㅂ","ㅏ","ㅂ"]],["산",["ㅅ","ㅏ","ㄴ","ㅣ"],["ㅅ","ㅏ","ㄴ"]]]},
 {tag:"STAGE 3 · WORD",title:"한글 미로 — ESCAPE",desc:"흩어진 자모로 목표 단어를 완성하세요. 정답 +10점!",type:"word",qs:[
  ["나무",["ㄴ","ㅏ","ㅁ","ㅜ","ㄱ","ㅗ"],["ㄴ","ㅏ","ㅁ","ㅜ"]],["바다",["ㅂ","ㅏ","ㄷ","ㅏ","ㅁ","ㅜ"],["ㅂ","ㅏ","ㄷ","ㅏ"]],["우유",["ㅇ","ㅜ","ㅇ","ㅠ","ㄱ","ㅏ"],["ㅇ","ㅜ","ㅇ","ㅠ"]],["하늘",["ㅎ","ㅏ","ㄴ","ㅡ","ㄹ","ㅗ"],["ㅎ","ㅏ","ㄴ","ㅡ","ㄹ"]],["고기",["ㄱ","ㅗ","ㄱ","ㅣ","ㅂ","ㅏ"],["ㄱ","ㅗ","ㄱ","ㅣ"]],["나라",["ㄴ","ㅏ","ㄹ","ㅏ","ㅁ","ㅗ"],["ㄴ","ㅏ","ㄹ","ㅏ"]],["나비",["ㄴ","ㅏ","ㅂ","ㅣ","ㄱ","ㅗ"],["ㄴ","ㅏ","ㅂ","ㅣ"]],["모자",["ㅁ","ㅗ","ㅈ","ㅏ","ㄴ","ㅜ"],["ㅁ","ㅗ","ㅈ","ㅏ"]],["바지",["ㅂ","ㅏ","ㅈ","ㅣ","ㄷ","ㅗ"],["ㅂ","ㅏ","ㅈ","ㅣ"]],["가수",["ㄱ","ㅏ","ㅅ","ㅜ","ㄴ","ㅓ"],["ㄱ","ㅏ","ㅅ","ㅜ"]]]}
];
let si=0,qi=0,score=0,stageScore=0,correct=0,selected=[],timer=null,seconds=30,locked=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){clearInterval(timer);stages.forEach(s=>s.qs=shuffle(s.qs));si=0;qi=0;score=0;stageScore=0;correct=0;locked=false;$("ending").classList.add("hide");$("game").classList.remove("hide");load()}
function load(){clearInterval(timer);locked=false;selected=[];seconds=30;let s=stages[si],q=s.qs[qi];$("stageNum").textContent=si+1;$("score").textContent=score;$("round").textContent=qi+1;$("time").textContent=seconds;$("bar").style.width=(qi/s.qs.length*100)+"%";$("stageTag").textContent=s.tag;$("title").textContent=s.title;$("stagePoints").textContent=`스테이지 점수 ${stageScore} / 100`;$("prompt").textContent=s.type==="find"?q[0]:s.type==="build"?`목표 음절: 「${q[0]}」`:`목표 단어: 「${q[0]}」`;$("instruction").textContent=s.desc;$("feedback").textContent="";$("next").classList.add("hide");$("choices").innerHTML="";$("buildArea").classList.add("hide");
if(s.type==="find"){shuffle(q[1]).forEach(x=>{let b=document.createElement("button");b.textContent=x;b.onclick=()=>answer(x===q[2],"정답은 "+q[2]+"!");$("choices").appendChild(b)})}
else { $("buildArea").classList.remove("hide");$("tiles").innerHTML="";$("wordbox").textContent="선택한 자모: ";shuffle(q[1]).forEach((x,i)=>{let b=document.createElement("button");b.className="tile";b.textContent=x;b.onclick=()=>{if(!locked){selected.push(x);b.disabled=true;renderSelected()}};$("tiles").appendChild(b)});$("submitBuild").onclick=()=>{let target=s.type==="build"?q[2]:q[2];let got=selected.join("");let ok=got===target;if(s.type==="word"){ // word mode asks to tap the exact jamo sequence
 ok=got===q[2].join("");
 }
 answer(ok,`정답: ${s.type==="build"?q[2].join(" + "):q[2].join(" + ")}`)};$("undo").onclick=()=>{if(!locked&&selected.length){selected.pop();Array.from($("tiles").children).forEach(b=>b.disabled=false);renderSelected()}}}
timer=setInterval(()=>{if(locked)return;seconds--;$("time").textContent=seconds;if(seconds<=0)answer(false,"시간 초과! 다음 미션으로 이동하세요.");},1000)}
function renderSelected(){$("wordbox").textContent=selected.length?"선택한 자모: "+selected.join(" + "):"아직 선택한 자모가 없어요"}
function answer(ok,msg){if(locked)return;locked=true;clearInterval(timer);$("choices").querySelectorAll("button").forEach(b=>b.disabled=true);$("tiles").querySelectorAll("button").forEach(b=>b.disabled=true);if(ok){score+=10;stageScore+=10;correct++;$("feedback").textContent="✨ 정답! +10점";}else{$("feedback").textContent="💡 "+msg;} $("score").textContent=score;$("stagePoints").textContent=`스테이지 점수 ${stageScore} / 100`;$("next").textContent=qi===9?(si===2?"결과 보기 →":"다음 스테이지 →"):"다음 미션 →";$("next").classList.remove("hide")}
$("next").onclick=()=>{if(qi<9){qi++;load()}else if(stageScore>=70){if(si<2){si++;qi=0;stageScore=0;load()}else finish()}else{$("feedback").textContent="70점 미만이에요. 이 스테이지를 다시 도전해 보세요!";$("next").textContent="스테이지 다시 도전";$("next").onclick=()=>{qi=0;stageScore=0;load()}}};
function finish(){clearInterval(timer);$("game").classList.add("hide");$("ending").classList.remove("hide");$("endText").textContent=`총점 ${score}점 · 정답 ${correct}개! ${score>=210?"완벽해요! 한글 월드를 구했어요!":"수고했어요! 다시 도전해서 더 높은 점수에 도전해 보세요."}`}
$("restart").onclick=start;$("playAgain").onclick=start;start();
</script></body></html>
